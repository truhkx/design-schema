name: swiftui-gates

# SwiftUI compiles on macOS and nowhere else (process/ios-platform.md, "Gates, and the Mac problem"), so
# this is the remote gate the swiftui generation loop polls with `gh run watch`.
#
# The three halves of the report tools/swiftui_gate.ts downloads:
#
#   build  `xcodebuild -scheme DesignSchema -destination 'generic/platform=iOS' build` — the typecheck, for
#          the platform the code is actually for — plus the host build of the tests and the gallery app.
#   tests  `swift test`: the whole Swift Testing suite (behavior scenarios, the theme table, the icon
#          snapshots), and the keyboard rules the doc declared, checked on an iPad simulator.
#   audit  `XCUIApplication().performAccessibilityAudit()` on the target's gallery screen.
#
# The UI half needs an app bundle to launch, which SwiftPM does not produce; the runner generates one with
# XcodeGen from apps/ios-gallery/project.yml (the trade-off is written up in that file and in the gallery's
# README). Nothing about the artifact's shape changed when job 440 filled in the last two halves —
# `{ build, tests, audit }` is the contract job 430 already reads.

on:
  push:
    # `gen/swiftui/<Name>` branches are pushed by the generator, which then dispatches this workflow
    # itself: without this the push would start a second run for the same commit, only to be cancelled
    # by the dispatch's own run through the concurrency group below.
    branches-ignore:
      - 'gen/swiftui/**'
    paths:
      - 'packages/swiftui/**'
      - 'apps/ios-gallery/**'
      # DesignSchemaTokens is generated by `pnpm tokens`, so a change to the build or its sources is a
      # change to the Swift the gate compiles even when the committed output has not been refreshed yet.
      - 'tokens/**'
      # Icon+Paths.swift is generated from this table and the snapshot test compares against these PNGs,
      # so either one changing is a change to what the gate checks.
      - 'tools/icon-paths.json'
      - 'tests/icon-snapshots/**'
      # The keyboard rules the XCUITest checks. Gitignored on ordinary branches; the generator force-adds
      # them onto a gen/swiftui/<Name> branch (tools/swiftui_gate.ts, GATE_INPUTS).
      - 'generated/keyboard/**'
      - '.github/workflows/swiftui-gates.yml'
  pull_request:
    paths:
      - 'packages/swiftui/**'
      - 'apps/ios-gallery/**'
      # DesignSchemaTokens is generated by `pnpm tokens`, so a change to the build or its sources is a
      # change to the Swift the gate compiles even when the committed output has not been refreshed yet.
      - 'tokens/**'
      # Icon+Paths.swift is generated from this table and the snapshot test compares against these PNGs,
      # so either one changing is a change to what the gate checks.
      - 'tools/icon-paths.json'
      - 'tests/icon-snapshots/**'
      - 'generated/keyboard/**'
      - '.github/workflows/swiftui-gates.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Component being gated — names the report artifact (gates/<Name>.swiftui.json)'
        required: false
        default: all

# One run per branch: the generation loop pushes a `gen/swiftui/<Name>` branch per component and only the
# newest push on a branch is worth minutes.
concurrency:
  group: swiftui-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    # The same 45 minutes tools/swiftui_gate.ts waits (RUN_TIMEOUT_S): a job that outlives the client
    # watching it is minutes nobody reads.
    timeout-minutes: 45
    env:
      TARGET: ${{ inputs.target || 'all' }}
      # xcodebuild's own build directory, outside the checkout so nothing it writes looks like a source
      # change to the generator folding a branch back.
      DERIVED_DATA: ${{ runner.temp }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      # Which toolchain answered is part of the gate's output: the currency policy tracks the latest stable
      # Xcode and Swift, and a runner image bump is how that arrives.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            packages/swiftui/.build
            apps/ios-gallery/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/swiftui/Package.swift', 'apps/ios-gallery/Package.swift', 'apps/ios-gallery/project.yml') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # Every gate step keeps going and records its own outcome: the generation loop wants all of the
      # errors from one round, not the first one, and the report step below turns the logs into the
      # artifact it reads. `set -o pipefail` keeps the step's status the compiler's, not tee's.
      - name: Prepare the gate logs
        run: |
          mkdir -p "$RUNNER_TEMP/gates"
          echo "GATE_LOGS=$RUNNER_TEMP/gates" >> "$GITHUB_ENV"

      # The typecheck, for the platform the code is for. `swift build` would compile the package for the
      # *host*, where a SwiftUI API can differ or not exist at all; `generic/platform=iOS` is the question
      # the generated file has to answer. No signing: a library for the generic device target is not
      # installed anywhere.
      - name: Build the package for iOS
        id: build
        continue-on-error: true
        working-directory: packages/swiftui
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild \
            -scheme DesignSchema \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA/package" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GATE_LOGS/build.log"

      # Builds DesignSchemaTests (Swift Testing) and DesignSchemaUITests for the host. The UI tests are an
      # empty module off iOS, so this is what keeps them compiling with the package they live in; the
      # bundle that actually runs is built from the Xcode project below.
      - name: Typecheck the tests
        id: build-tests
        continue-on-error: true
        working-directory: packages/swiftui
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$GATE_LOGS/build-tests.log"

      # The whole Swift Testing suite: the docs' behavior scenarios (job 460), the theme table, and the
      # icon snapshots — every glyph in tools/icon-paths.json, parsed by Support/SVGPath.swift and rendered
      # by `ImageRenderer` at 16 pt, against the PNG Playwright rendered from the same `d` string
      # (job 420). It runs on the host because none of it needs a simulator.
      - name: Swift tests
        id: swift-test
        continue-on-error: true
        working-directory: packages/swiftui
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$GATE_LOGS/swift-test.log"

      # Not a gate: if this fails the gallery step below says `xcodegen: command not found` in the build
      # section, which is where a missing tool belongs.
      - name: Install XcodeGen
        continue-on-error: true
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install --quiet xcodegen
          xcodegen --version

      # The gallery app for the simulator, and the UI-test bundle with it. `build-for-testing` is the split
      # that keeps the report honest: a compile error in a gallery screen is a *build* failure, and only
      # what happens after the app launches is a test or an audit failure.
      - name: Build the gallery app and the UI tests
        id: gallery
        continue-on-error: true
        run: |
          set -o pipefail
          xcodegen generate --spec apps/ios-gallery/project.yml --project apps/ios-gallery 2>&1 | tee "$GATE_LOGS/gallery.log"
          NSUnbufferedIO=YES xcodebuild \
            -project apps/ios-gallery/DesignSchemaGallery.xcodeproj \
            -scheme DesignSchemaGallery \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA/gallery" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee -a "$GATE_LOGS/gallery.log"

      # An iPad, because the keyboard block is iPadOS hardware-keyboard behavior
      # (process/ios-platform.md: `.onKeyPress`, `.focusSection()`), and a hardware keyboard attached to
      # it, because `typeKey` has nothing to type on otherwise. The preference has to be written before the
      # device boots — the simulator reads it once — and `cfprefsd` has to be told to flush it first.
      - name: Boot an iPad with a hardware keyboard
        id: simulator
        if: steps.gallery.outcome == 'success'
        run: |
          set -o pipefail
          UDID="$(xcrun simctl list devices available --json | node tools/swift-sim.mjs)"
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
          PLIST="$HOME/Library/Preferences/com.apple.iphonesimulator.plist"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID:ConnectHardwareKeyboard bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$UDID:ConnectHardwareKeyboard true" "$PLIST"
          killall -u "$USER" cfprefsd 2>/dev/null || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # The audit and the keyboard rules, on the screen `inputs.target` names. The rules travel as JSON
      # rather than as a file the test bundle carries: Xcode forwards any `TEST_RUNNER_`-prefixed variable
      # to the test-runner process with the prefix stripped, which is the only channel from this job to a
      # process on a simulator. A component with no `keyboard` block (Button is one) sends nothing and the
      # keyboard half reports that it had nothing to check.
      - name: Accessibility audit and keyboard rules
        id: uitests
        if: steps.simulator.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          SPEC_FILE="generated/keyboard/$TARGET.json"
          if [ -f "$SPEC_FILE" ]; then
            # JSON has no significant newlines outside string literals, and a one-line value is one less
            # thing between here and the simulator.
            TEST_RUNNER_DS_KEYBOARD_SPEC="$(tr '\n' ' ' < "$SPEC_FILE")"
            echo "keyboard rules: $SPEC_FILE"
          else
            TEST_RUNNER_DS_KEYBOARD_SPEC=''
            echo "keyboard rules: none for $TARGET (the doc declares no keyboard block)"
          fi
          export TEST_RUNNER_DS_KEYBOARD_SPEC
          export TEST_RUNNER_DS_TARGET="$TARGET"
          NSUnbufferedIO=YES xcodebuild \
            -project apps/ios-gallery/DesignSchemaGallery.xcodeproj \
            -scheme DesignSchemaGallery \
            -destination "id=$SIMULATOR" \
            -derivedDataPath "$DERIVED_DATA/gallery" \
            -resultBundlePath "$GATE_LOGS/uitests.xcresult" \
            -only-testing:DesignSchemaUITests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee "$GATE_LOGS/uitests.log"

      # The contract with tools/swiftui_gate.ts: gates/<Name>.swiftui.json, uploaded whatever happened, so
      # a failing round comes back as errors the model can fix rather than as "the run was red".
      - name: Gate report
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          BUILD_TESTS: ${{ steps.build-tests.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
          SWIFT_TEST: ${{ steps.swift-test.outcome }}
          SIMULATOR_STEP: ${{ steps.simulator.outcome }}
          UITESTS: ${{ steps.uitests.outcome }}
        run: |
          echo "$BUILD" > "$GATE_LOGS/build.outcome"
          echo "$BUILD_TESTS" > "$GATE_LOGS/build-tests.outcome"
          echo "$GALLERY" > "$GATE_LOGS/gallery.outcome"
          echo "$SWIFT_TEST" > "$GATE_LOGS/swift-test.outcome"
          # A simulator that never booted is the gate failing to run, not the component failing: the UI
          # step's own outcome would be `skipped`, which the report reads as "not run".
          if [ "$SIMULATOR_STEP" != success ] && [ "$SIMULATOR_STEP" != skipped ]; then
            echo "failure" > "$GATE_LOGS/uitests.outcome"
            echo "the iPad simulator did not boot — see the run log" >> "$GATE_LOGS/uitests.log"
          else
            echo "$UITESTS" > "$GATE_LOGS/uitests.outcome"
          fi
          node tools/swift-gate-report.mjs "$TARGET" "$GATE_LOGS" gates
          {
            echo "## swiftui gates: $TARGET"
            echo '```json'
            cat "gates/$TARGET.swiftui.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ inputs.target || 'all' }}
          path: gates/
          if-no-files-found: error

      # The logs behind the report, for a human reading a red run. Not what the generator reads.
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ inputs.target || 'all' }}
          path: ${{ runner.temp }}/gates/
          if-no-files-found: ignore
          retention-days: 7

      # `continue-on-error` above made every gate step green; this is what makes the run itself red, so
      # `gh run watch --exit-status` and a human looking at the checks agree with the report.
      - name: Gates
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          BUILD_TESTS: ${{ steps.build-tests.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
          SWIFT_TEST: ${{ steps.swift-test.outcome }}
          SIMULATOR_STEP: ${{ steps.simulator.outcome }}
          UITESTS: ${{ steps.uitests.outcome }}
        run: |
          for outcome in "$BUILD" "$BUILD_TESTS" "$GALLERY" "$SWIFT_TEST" "$SIMULATOR_STEP" "$UITESTS"; do
            [ "$outcome" = success ] || exit 1
          done
