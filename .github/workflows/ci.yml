name: ci
on:
  push:
    branches: [main, master]
  pull_request:

# Toolchain is pinned in the repo: Node major from .nvmrc, pnpm from package.json#packageManager
# (pnpm/action-setup reads it when no version is given). The docs tooling is moving from Python (tools/*.py) to
# TypeScript (tools/*.ts, run by Node directly) one tool at a time — process/typescript-and-currency.md.

jobs:
  docs-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt pytest
      - run: pnpm install --frozen-lockfile
      # Docs are the source of truth: they must parse, every declared contrast pair must pass,
      # and no generated file may reference a literal color/size/duration.
      - run: pnpm check
      - run: pnpm tokens
      - run: pnpm lint:literals
      - run: pytest
      # The TypeScript tools (tools/*.ts) and their Vitest suite.
      - run: pnpm typecheck:tools
      - run: pnpm test:tools
      - run: pnpm typecheck
      # Generated code must be current with its docs (prompt hash); a stale target fails the build.
      - run: pnpm generate:check

  browser-gates:
    runs-on: ubuntu-latest
    needs: docs-and-gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm gates:browser

  # Every dependency tracks its latest stable release (process/typescript-and-currency.md, Workstream C).
  # tools/currency.ts reads `pnpm outdated --recursive --format json` and fails when anything is more
  # than one minor behind its `latest` tag; .currency-allow.json holds dated exceptions, and an expired
  # entry fails on its own. Node from .nvmrc runs the .ts file directly (type stripping, no build step).
  currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # `pnpm outdated` reports the installed version, so install (scripts are not needed for that).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/currency.ts

  # What the next majors break: React canary, TypeScript nightly, Storybook next. Installed into a copy
  # of the workspace so the checkout's package.json files and lockfile stay untouched. Allowed to fail:
  # the outcome lands in the job summary, not in the merge gate, so the day a major ships the
  # breakage is already known.
  next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Copy the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/next"
          rsync -a --exclude .git --exclude node_modules ./ "$RUNNER_TEMP/next/"
      - name: Install react@canary, typescript@next, storybook@next
        id: install
        continue-on-error: true
        working-directory: ${{ runner.temp }}/next
        run: |
          pnpm --filter @design-schema/react --filter @design-schema/rn add -D react@canary react-dom@canary
          pnpm --filter @design-schema/rn add -D react-test-renderer@canary
          pnpm --filter @design-schema/react --filter @design-schema/rn add -D storybook@next @storybook/react@next @storybook/react-vite@next @storybook/addon-a11y@next @storybook/addon-docs@next @storybook/addon-mcp@next
          pnpm --filter @design-schema/lit add -D storybook@next @storybook/web-components@next @storybook/web-components-vite@next @storybook/addon-a11y@next @storybook/addon-docs@next @storybook/addon-mcp@next
          pnpm --filter @design-schema/react --filter @design-schema/lit --filter @design-schema/rn add -D typescript@next
          pnpm -r --filter "@design-schema/*" list --depth 0 react react-dom typescript storybook | tee versions.txt
          pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/next
        run: pnpm typecheck
      - name: Tests
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/next
        run: pnpm -r --no-bail --filter "@design-schema/*" run test
      - name: Report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo '## next: react@canary, typescript@next, storybook@next'
            echo
            echo '| step | outcome |'
            echo '| --- | --- |'
            echo "| install | $INSTALL |"
            echo "| typecheck | $TYPECHECK |"
            echo "| tests | $TEST |"
            echo
            echo '```'
            cat "$RUNNER_TEMP/next/versions.txt" 2>/dev/null || echo '(install did not get as far as resolving versions)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$INSTALL" = success ] && [ "$TYPECHECK" = success ] && [ "$TEST" = success ]
