# docker compose -f apps/website/compose.yaml up -d --build
#
# Locally: http://localhost:8080. On a server with a domain pointed at it, create apps/website/.env with
#   SITE_ADDRESS=example.com
#   HTTP_PORT=80
#   HTTPS_PORT=443
# and Caddy serves HTTPS with a certificate it obtains and renews itself (kept in the caddy_data volume).

name: design-schema-website

services:
  website:
    build:
      context: ../..
      dockerfile: apps/website/Dockerfile
    image: design-schema-website
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
